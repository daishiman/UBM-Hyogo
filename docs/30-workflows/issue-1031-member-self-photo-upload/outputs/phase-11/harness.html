<!doctype html>
<!--
  issue-1031 Phase 11 component harness
  PhotoUpload.client.tsx の各 UI 状態を、実 tokens.css の OKLch / HEX 値を用いて再現する。
  認証付き /profile ライブページの撮影はフルスタック（auth + R2 + D1 seed）を要するため、
  確立された component-isolation harness 方式（issue-1006 先例）で新規 UI を視覚検証する。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ubm-color-surface-panel: #ffffff;
        --ubm-color-surface-panel-2: #fafaf8;
        --ubm-color-surface-base: #f4f3ef;
        --ubm-color-text-primary: #1a1917;
        --ubm-color-text-secondary: #57554e;
        --ubm-color-border-default: #e7e5df;
        --ubm-color-accent: oklch(0.52 0.1 55);
        --ubm-color-ok: oklch(0.55 0.1 155);
        --ubm-color-danger: oklch(0.55 0.15 25);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ubm-color-surface-base);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: var(--ubm-color-text-primary);
        padding: 24px;
      }
      .grid { display: grid; grid-template-columns: repeat(2, 380px); gap: 20px; }
      .card {
        background: var(--ubm-color-surface-panel);
        border: 1px solid var(--ubm-color-border-default);
        border-radius: 12px;
        padding: 20px;
      }
      .card h3 { margin: 0 0 14px; font-size: 13px; color: var(--ubm-color-text-secondary); font-weight: 600; }

      /* --- PhotoUpload section（component の DOM 構造を忠実再現） --- */
      .pu { display: flex; flex-direction: column; gap: 12px; }
      .avatar {
        width: 48px; height: 48px; border-radius: 999px;
        display: inline-flex; align-items: center; justify-content: center;
        font-weight: 700; color: #fff;
        background: oklch(0.68 0.16 50);
        box-shadow: 0 1px 2px rgba(0,0,0,.08);
        overflow: hidden;
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
      .row { display: flex; align-items: center; gap: 8px; }
      .label {
        cursor: pointer; border-radius: 6px; padding: 6px 12px; font-size: 14px;
        background: var(--ubm-color-surface-panel-2);
        color: var(--ubm-color-accent);
        border: 1px solid var(--ubm-color-border-default);
      }
      .label.locked { opacity: .5; pointer-events: none; }
      .btn-danger {
        border-radius: 6px; padding: 6px 12px; font-size: 14px;
        color: var(--ubm-color-danger);
        border: 1px solid var(--ubm-color-border-default);
        background: transparent; cursor: pointer;
      }
      .btn-plain {
        border-radius: 6px; padding: 4px 8px; font-size: 14px;
        border: 1px solid var(--ubm-color-border-default);
        background: transparent; cursor: pointer; color: var(--ubm-color-text-primary);
      }
      .confirm { display: flex; align-items: center; gap: 8px; }
      .confirm span { font-size: 14px; }
      .msg-ok { font-size: 14px; color: var(--ubm-color-ok); margin: 0; }
      .msg-err { font-size: 14px; color: var(--ubm-color-danger); margin: 0; }
    </style>
  </head>
  <body>
    <div class="grid">
      <!-- 状態1: idle / 写真なし（hue placeholder） -->
      <div class="card">
        <h3>① idle — 写真未登録（hue placeholder・現行と pixel diff ゼロ / AC-9）</h3>
        <section class="pu" aria-label="プロフィール写真">
          <div class="avatar" role="img" aria-label="田中">田</div>
          <div class="row">
            <label class="label">写真を変更</label>
          </div>
        </section>
      </div>

      <!-- 状態2: 写真登録済み（img + 削除ボタン） -->
      <div class="card">
        <h3>② 写真登録済み — Avatar が img を描画・削除ボタン表示</h3>
        <section class="pu" aria-label="プロフィール写真">
          <div class="avatar" role="img" aria-label="田中">
            <img
              alt="田中"
              src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'&gt;&lt;defs&gt;&lt;linearGradient id='g' x1='0' y1='0' x2='1' y2='1'&gt;&lt;stop offset='0' stop-color='%23c98a3b'/&gt;&lt;stop offset='1' stop-color='%237a5230'/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;&lt;rect width='48' height='48' fill='url(%23g)'/&gt;&lt;/svg&gt;"
            />
          </div>
          <div class="row">
            <label class="label">写真を変更</label>
            <button class="btn-danger" aria-label="プロフィール写真を削除">削除</button>
          </div>
        </section>
      </div>

      <!-- 状態3: 削除確認 -->
      <div class="card">
        <h3>③ 削除確認ダイアログ（role=alertdialog）</h3>
        <section class="pu" aria-label="プロフィール写真">
          <div class="avatar" role="img" aria-label="田中">
            <img
              alt="田中"
              src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'&gt;&lt;rect width='48' height='48' fill='%237a5230'/&gt;&lt;/svg&gt;"
            />
          </div>
          <div class="row">
            <label class="label">写真を変更</label>
          </div>
          <div class="confirm" role="alertdialog" aria-label="写真削除の確認">
            <span>写真を削除しますか？</span>
            <button class="btn-danger">削除する</button>
            <button class="btn-plain">キャンセル</button>
          </div>
        </section>
      </div>

      <!-- 状態4: アップロード中 + 成功 / エラー -->
      <div class="card">
        <h3>④ uploading（input disabled）/ success(role=status) / error(role=alert)</h3>
        <section class="pu" aria-label="プロフィール写真">
          <div class="avatar" role="img" aria-label="田中">田</div>
          <div class="row">
            <label class="label locked">アップロード中…</label>
          </div>
          <p class="msg-ok" role="status">写真を更新しました</p>
          <p class="msg-err" role="alert">ファイルが大きすぎます（上限 256KB）。</p>
        </section>
      </div>
    </div>
  </body>
</html>
