<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>issue-1030 member avatar visual harness</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #667085;
        --border: #d6dae3;
        --accent: #2f6fed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: min(920px, calc(100vw - 32px));
        margin: 32px auto;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 18px;
      }
      .avatar {
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--border), transparent 25%);
        background: hsl(var(--hue) 68% 45%);
        color: white;
        font-weight: 700;
        line-height: 1;
        user-select: none;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .sm {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }
      .md {
        width: 56px;
        height: 56px;
        font-size: 18px;
      }
      .lg {
        width: 96px;
        height: 96px;
        font-size: 28px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 112px;
      }
      .meta {
        min-width: 0;
      }
      .label {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }
      .note {
        margin: 5px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 60%);
        border-radius: 999px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 650;
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>issue-1030 avatar variant / fallback visual check</h1>
      <section class="grid" aria-label="avatar states">
        <article class="panel">
          <div class="row">
            <div class="avatar md" style="--hue: 206">
              <img
                alt="thumb variant"
                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop stop-color='%232f6fed'/%3E%3Cstop offset='1' stop-color='%2320a67a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='96' height='96' fill='url(%23g)'/%3E%3Ccircle cx='48' cy='35' r='16' fill='white' fill-opacity='.92'/%3E%3Cpath d='M20 84c4-20 52-20 56 0' fill='white' fill-opacity='.9'/%3E%3C/svg%3E"
              />
            </div>
            <div class="meta">
              <span class="badge">thumb</span>
              <p class="label">sm/md uses photoThumbUrl</p>
              <p class="note">96px cover crop keeps the row avatar stable.</p>
            </div>
          </div>
        </article>
        <article class="panel">
          <div class="row">
            <div class="avatar lg" style="--hue: 206">
              <img
                alt="display variant"
                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 384'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop stop-color='%232f6fed'/%3E%3Cstop offset='1' stop-color='%23ef7d45'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='384' fill='url(%23g)'/%3E%3Ccircle cx='256' cy='142' r='70' fill='white' fill-opacity='.92'/%3E%3Cpath d='M110 366c20-108 272-108 292 0' fill='white' fill-opacity='.9'/%3E%3C/svg%3E"
              />
            </div>
            <div class="meta">
              <span class="badge">display</span>
              <p class="label">lg uses photoUrl</p>
              <p class="note">Large drawer state does not stretch thumb.</p>
            </div>
          </div>
        </article>
        <article class="panel">
          <div class="row">
            <div class="avatar md" style="--hue: 118">TH</div>
            <div class="meta">
              <span class="badge">fallback</span>
              <p class="label">photo missing or load error</p>
              <p class="note">Existing hue placeholder remains consistent.</p>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
