name: verify-runtime-smoke-secret-contract

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-smoke-staging.yml"
      - ".github/workflows/verify-runtime-smoke-secret-contract.yml"
      - "scripts/smoke/provision-staging-secrets.sh"
      - "scripts/smoke/verify-runtime-smoke-secret-contract.mts"
      - "scripts/smoke/__tests__/verify-runtime-smoke-secret-contract.spec.ts"
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: setup project
        uses: ./.github/actions/setup-project

      - name: verify runtime smoke secret contract
        run: pnpm exec tsx scripts/smoke/verify-runtime-smoke-secret-contract.mts
