name: verify-no-localhost-bake

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: verify-no-localhost-bake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-no-localhost-bake:
    name: verify-no-localhost-bake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: self-test
        run: mise exec -- pnpm vitest run scripts/verify-no-localhost-bake.spec.ts
      - name: source grep gate
        run: bash scripts/verify-no-localhost-bake.sh --src-only
