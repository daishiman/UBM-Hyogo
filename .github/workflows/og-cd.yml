# 目的: OG 専用 Cloudflare Worker への dev/main デプロイ
name: og-cd

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/og/**"
      - ".github/workflows/og-cd.yml"
      - "scripts/check-worker-size.sh"

concurrency:
  group: og-cd-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project
        with:
          setup-strategy: mise

      - name: Build OG Worker bundle
        run: mise exec -- pnpm --filter @ubm-hyogo/og build -- --env staging

      - name: Check OG Worker bundle size
        # dist ディレクトリを渡し index.js + wasm (yoga/resvg) を合算測定する。
        # wasm/フォント肥大を size gate が確実に捕捉するため (index.js 単体では wasm を見落とす)。
        run: bash scripts/check-worker-size.sh apps/og/dist

      - name: Deploy OG Worker to Cloudflare (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Confirm GitHub Environment 'staging' has CLOUDFLARE_API_TOKEN registered."
            exit 1
          fi
          bash scripts/cf.sh deploy --config apps/og/wrangler.toml --env staging 2>&1 | tee og-cd-staging-deploy.log

      - name: Verify deploy log redaction
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/redaction-check.sh --log og-cd-staging-deploy.log --account-id "$CLOUDFLARE_ACCOUNT_ID"

  deploy-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project
        with:
          setup-strategy: mise

      - name: Build OG Worker bundle
        run: mise exec -- pnpm --filter @ubm-hyogo/og build -- --env production

      - name: Check OG Worker bundle size
        # dist ディレクトリを渡し index.js + wasm (yoga/resvg) を合算測定する。
        # wasm/フォント肥大を size gate が確実に捕捉するため (index.js 単体では wasm を見落とす)。
        run: bash scripts/check-worker-size.sh apps/og/dist

      - name: Deploy OG Worker to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Confirm GitHub Environment 'production' has CLOUDFLARE_API_TOKEN registered."
            exit 1
          fi
          bash scripts/cf.sh deploy --config apps/og/wrangler.toml --env production 2>&1 | tee og-cd-production-deploy.log

      - name: Verify deploy log redaction
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/redaction-check.sh --log og-cd-production-deploy.log --account-id "$CLOUDFLARE_ACCOUNT_ID"
