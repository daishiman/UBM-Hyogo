name: playwright-smoke

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'scripts/verify-design-tokens.ts'
      - '.github/workflows/playwright-smoke.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional deployed base URL'
        required: false
        type: string
      staging_visual_base_url:
        description: 'Cloudflare Workers staging URL for the staging-visual project (e.g. https://ubm-hyogo-web-staging.daishimanju.workers.dev). When set, the staging-visual job runs against it.'
        required: false
        type: string
      staging_visual_update_snapshots:
        description: 'Generate/refresh staging-visual baselines (-staging-visual-chromium-linux.png). Use for the first capture, then download the artifact and commit it.'
        required: false
        type: boolean
        default: false
      staging_visual_member_detail_id:
        description: 'Optional representative member id for /members/[id] staging visual baseline. When empty, that dynamic-route test is skipped.'
        required: false
        type: string

concurrency:
  group: playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}
      PLAYWRIGHT_EVIDENCE_TASK: task-18-w7
      PLAYWRIGHT_TASK18_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install deps
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Install Chromium
        run: mise exec -- pnpm --filter @ubm-hyogo/web exec playwright install --with-deps chromium
      - name: Run 19-route smoke
        run: mise exec -- pnpm --filter @ubm-hyogo/web e2e:smoke
      - name: Run attendance visual smoke
        env:
          PLAYWRIGHT_EVIDENCE_TASK: 07c-followup-002
          PLAYWRIGHT_TASK18_SMOKE: ''
        run: |
          mise exec -- pnpm --filter @ubm-hyogo/web exec playwright test \
            playwright/tests/attendance.spec.ts --project=desktop-chromium --trace on
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: docs/30-workflows/task-18-w7-verify-tokens-and-playwright-smoke/outputs/phase-11/evidence/playwright-report
          if-no-files-found: ignore

  visual:
    name: visual (chromium, 4 screens)
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}
      PLAYWRIGHT_EVIDENCE_TASK: task-18-w7
      PLAYWRIGHT_TASK18_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install deps
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Install Chromium
        run: mise exec -- pnpm --filter @ubm-hyogo/web exec playwright install --with-deps chromium
      - name: Run visual baseline
        run: mise exec -- pnpm --filter @ubm-hyogo/web e2e:visual
      - name: Upload visual artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-artifacts
          path: docs/30-workflows/task-18-w7-verify-tokens-and-playwright-smoke/outputs/phase-11/evidence/test-results
          if-no-files-found: ignore

  # issue-902: production-equivalent runtime (Cloudflare Workers staging) の visual baseline。
  # manual deploy 後に workflow_dispatch で staging URL を渡したときのみ実行する ops gate。
  # baseline 正本は本 job（ubuntu-latest）が生成する -staging-visual-chromium-linux.png。
  # macOS local 生成 baseline はコミットしない（docs/30-workflows/issue-902-.../phase-04 §4）。
  staging-visual:
    name: staging-visual (chromium, 6 screens)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.staging_visual_base_url != ''
    timeout-minutes: 15
    env:
      PLAYWRIGHT_STAGING_BASE_URL: ${{ inputs.staging_visual_base_url }}
      PLAYWRIGHT_MEMBER_DETAIL_ID: ${{ inputs.staging_visual_member_detail_id || '' }}
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      # reporter / test-results 出力を本 workflow の evidence dir に向ける（apps/web を cwd とした相対）
      PLAYWRIGHT_EVIDENCE_DIR: ../../docs/30-workflows/completed-tasks/issue-902-members-staging-visual-baseline/outputs/phase-11/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install deps
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Install Chromium
        run: mise exec -- pnpm --filter @ubm-hyogo/web exec playwright install --with-deps chromium
      - name: Run staging visual (6 screens)
        run: |
          mise exec -- pnpm --filter @ubm-hyogo/web e2e:visual:staging ${{ inputs.staging_visual_update_snapshots && '--update-snapshots' || '' }}
      - name: Upload staging-visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-visual-baselines
          path: apps/web/playwright/tests/visual-staging/**/*-staging-visual-chromium-linux.png
          if-no-files-found: warn
      - name: Upload staging-visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-visual-artifacts
          path: docs/30-workflows/completed-tasks/issue-902-members-staging-visual-baseline/outputs/phase-11/evidence/test-results
          if-no-files-found: ignore

  # admin-visual-baseline-admin-routes-task-e: 10 required + 2 env-gated admin
  # routes × 4 viewport baselines against Cloudflare Workers staging.
  # *-linux.png baseline is generated by this job on ubuntu-latest; macOS local
  # captures are not committed.
  admin-visual:
    name: admin-visual (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.staging_visual_base_url != ''
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet, desktop, wide]
    env:
      PLAYWRIGHT_STAGING_BASE_URL: ${{ inputs.staging_visual_base_url }}
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      PLAYWRIGHT_ADMIN_MEMBER_DETAIL_ID: ${{ secrets.PLAYWRIGHT_ADMIN_MEMBER_DETAIL_ID }}
      PLAYWRIGHT_ADMIN_MEETING_DETAIL_ID: ${{ secrets.PLAYWRIGHT_ADMIN_MEETING_DETAIL_ID }}
      # Keep reports/test-results under the Task E evidence root instead of
      # the generic UT-DSF-07 staging visual evidence directory.
      PLAYWRIGHT_EVIDENCE_DIR: ../../docs/30-workflows/completed-tasks/admin-visual-baseline-admin-routes-task-e/outputs/phase-11/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install deps
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Install Chromium
        run: mise exec -- pnpm --filter @ubm-hyogo/web exec playwright install --with-deps chromium
      - name: Detail seed preflight (both-or-none)
        run: |
          if { [ -n "${PLAYWRIGHT_ADMIN_MEMBER_DETAIL_ID:-}" ] && [ -z "${PLAYWRIGHT_ADMIN_MEETING_DETAIL_ID:-}" ]; } || { [ -z "${PLAYWRIGHT_ADMIN_MEMBER_DETAIL_ID:-}" ] && [ -n "${PLAYWRIGHT_ADMIN_MEETING_DETAIL_ID:-}" ]; }; then
            echo "Both PLAYWRIGHT_ADMIN_MEMBER_DETAIL_ID and PLAYWRIGHT_ADMIN_MEETING_DETAIL_ID must be set together; 44 PNG baseline is forbidden." >&2
            exit 1
          fi
      - name: Run admin visual baseline (${{ matrix.viewport }})
        run: |
          mise exec -- pnpm --filter @ubm-hyogo/web exec playwright test \
            --project=admin-staging-visual-${{ matrix.viewport }} \
            ${{ inputs.staging_visual_update_snapshots && '--update-snapshots' || '' }}
      - name: Upload admin-visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-baselines-${{ matrix.viewport }}
          path: apps/web/playwright/tests/visual/admin-shell/**/*-admin-staging-visual-${{ matrix.viewport }}-linux.png
          if-no-files-found: warn
      - name: Upload admin-visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-diff-${{ matrix.viewport }}
          path: docs/30-workflows/completed-tasks/admin-visual-baseline-admin-routes-task-e/outputs/phase-11/evidence
          if-no-files-found: ignore
