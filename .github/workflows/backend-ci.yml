# 目的: Cloudflare Workers の dev/main デプロイ
# 範囲: dev -> staging, main -> production
name: backend-ci

on:
  push:
    branches: [dev, main]

concurrency:
  group: backend-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Preflight - verify Cloudflare secrets are injected
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for var in CF_TOKEN CF_ACCOUNT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::'$var' is empty. Set CLOUDFLARE_API_TOKEN in GitHub Environment 'staging' (Settings → Environments → staging)."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "OK: Cloudflare secrets injected (token length=${#CF_TOKEN})"

      - name: Apply D1 migrations
        id: migrate
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.85.0
          workingDirectory: apps/api
          command: d1 migrations apply ubm-hyogo-db-staging --env staging --remote
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Workers app
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.85.0
          workingDirectory: apps/api
          command: deploy --env staging
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record post-migration deploy failure
        if: ${{ failure() && steps.migrate.outcome == 'success' && steps.deploy.outcome == 'failure' }}
        run: |
          {
            echo "## Post-migration deploy failure"
            echo
            echo "D1 migrations were applied to staging, but the Workers deploy step failed."
            echo "Do not re-run migrations blindly. Inspect the deploy failure, verify the D1 migration ledger, and re-run the deploy after the root cause is fixed."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Preflight - verify Cloudflare secrets are injected
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for var in CF_TOKEN CF_ACCOUNT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::'$var' is empty. Set CLOUDFLARE_API_TOKEN in GitHub Environment 'production' (Settings → Environments → production)."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "OK: Cloudflare secrets injected (token length=${#CF_TOKEN})"

      - name: Apply D1 migrations
        id: migrate
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.85.0
          workingDirectory: apps/api
          command: d1 migrations apply ubm-hyogo-db-prod --env production --remote
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Workers app
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.85.0
          workingDirectory: apps/api
          command: deploy --env production
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record post-migration deploy failure
        if: ${{ failure() && steps.migrate.outcome == 'success' && steps.deploy.outcome == 'failure' }}
        run: |
          {
            echo "## Post-migration deploy failure"
            echo
            echo "D1 migrations were applied to production, but the Workers deploy step failed."
            echo "Do not re-run migrations blindly. Inspect the deploy failure, verify the D1 migration ledger, and re-run the deploy after the root cause is fixed."
          } >> "$GITHUB_STEP_SUMMARY"

  runtime-smoke-staging:
    name: runtime smoke staging
    needs: [deploy-staging]
    if: success() && github.ref_name == 'dev' && !contains(github.event.head_commit.message, '[skip runtime-smoke]')
    uses: ./.github/workflows/runtime-smoke-staging.yml
    secrets: inherit
