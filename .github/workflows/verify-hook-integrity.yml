# 目的: lefthook.yml を Git hook の唯一の正本に保つ状態を CI で恒久保持する gate（issue-230）
# 検証対象:
#   A. lefthook.yml が参照する scripts/hooks/*.sh / *.mjs が実在するか
#   B. git 管理下に手書き hook の shadow（hooks/pre-commit 等）が commit されていないか
#   C. lefthook.yml の構造健全性（min_version）
# 正本スクリプト: scripts/verify-hook-integrity.sh（local pre-push 等と共用）
# 方針: CLAUDE.md「Git hook の方針」/ docs/00-getting-started-manual/lefthook-operations.md
name: verify-hook-integrity

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: verify-hook-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-hook-integrity:
    name: verify-hook-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify lefthook.yml integrity
        run: bash scripts/verify-hook-integrity.sh
