# 目的: API staging deploy 完了後に attendanceProvider runtime smoke を自動実行
# trigger: backend-ci.yml から workflow_call / workflow_dispatch (debug)
# 実装仕様: docs/30-workflows/issue-571-runtime-smoke-ci-staging-integration/phase-05.md
name: runtime-smoke-staging

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      reason:
        description: "manual run reason"
        required: false
        default: "ad-hoc smoke"

permissions:
  contents: read

concurrency:
  group: runtime-smoke-staging
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging-runtime-smoke
    timeout-minutes: 10
    env:
      STAGING_API_BASE: ${{ secrets.STAGING_API_BASE }}
      STAGING_ADMIN_BEARER: ${{ secrets.STAGING_ADMIN_BEARER }}
      STAGING_MEMBER_ID: ${{ secrets.STAGING_MEMBER_ID }}
      STAGING_ME_BEARER: ${{ secrets.STAGING_ME_BEARER }}
      # 署名鍵が設定されていれば mint step が実行毎に短命 JWT を発行する（失効不能）。
      # 未設定時は mint step を skip し、上記の静的 bearer を使う後方互換 fallback。
      STAGING_AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
      # staging では freshness gate を warn-only にして、静的 bearer の寿命切れで
      # smoke 全体が毎回 fail するのを防ぐ。'1' にすると従来の hard-fail へ復帰できる。
      RUNTIME_SMOKE_FRESHNESS_ENFORCE: '0'
    steps:
      - uses: actions/checkout@v4

      - name: setup project
        uses: ./.github/actions/setup-project

      - name: mint staging bearers
        # STAGING_AUTH_SECRET が設定された環境でのみ短命 JWT を mint。
        # 未設定時は skip し、静的 STAGING_ADMIN_BEARER / STAGING_ME_BEARER を使う（AC-4 fallback）。
        if: env.STAGING_AUTH_SECRET != ''
        env:
          STAGING_AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          STAGING_ADMIN_MEMBER_ID: ${{ secrets.STAGING_ADMIN_MEMBER_ID }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ME_MEMBER_ID: ${{ secrets.STAGING_ME_MEMBER_ID }}
          STAGING_ME_EMAIL: ${{ secrets.STAGING_ME_EMAIL }}
          MINT_TTL_SECONDS: '600'
        run: |
          mint_out="$(mktemp)"
          GITHUB_OUTPUT="$mint_out" pnpm exec tsx scripts/smoke/mint-staging-bearers.mts
          admin="$(grep '^admin_bearer=' "$mint_out" | tail -n1 | cut -d= -f2-)"
          me="$(grep '^me_bearer=' "$mint_out" | tail -n1 | cut -d= -f2-)"
          mid="$(grep '^member_id=' "$mint_out" | tail -n1 | cut -d= -f2-)"
          rm -f "$mint_out"
          # mask を GITHUB_ENV export より前に必ず適用し JWT 平文露出のレースを排除（不変条件 3）。
          echo "::add-mask::$admin"
          echo "::add-mask::$me"
          echo "::add-mask::$mid"
          {
            echo "STAGING_ADMIN_BEARER=$admin"
            echo "STAGING_ME_BEARER=$me"
            echo "STAGING_MEMBER_ID=$mid"
            echo "RUNTIME_SMOKE_AUTH_PATH=minted"
          } >> "$GITHUB_ENV"

      - name: verify required staging secrets
        run: |
          missing=()
          for name in STAGING_API_BASE STAGING_ADMIN_BEARER STAGING_MEMBER_ID STAGING_ME_BEARER; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf "::error::missing secrets in environment 'staging-runtime-smoke': %s\n" "${missing[*]}"
            echo "::error::register via 'gh secret set <NAME> --env staging-runtime-smoke' (see docs/30-workflows/ci-secret-alignment-and-runtime-smoke-recovery/runbooks/secret-provisioning.md)"
            exit 1
          fi

      - name: mask staging credentials
        run: |
          if [ -z "${RUNTIME_SMOKE_AUTH_PATH:-}" ]; then
            echo "RUNTIME_SMOKE_AUTH_PATH=static-fallback" >> "$GITHUB_ENV"
            echo "::notice::runtime-smoke auth path: static-fallback (STAGING_AUTH_SECRET not provisioned)"
          else
            echo "::notice::runtime-smoke auth path: $RUNTIME_SMOKE_AUTH_PATH"
          fi
          echo "::add-mask::$STAGING_ADMIN_BEARER"
          echo "::add-mask::$STAGING_ME_BEARER"
          echo "::add-mask::$STAGING_API_BASE"
          echo "::add-mask::$STAGING_MEMBER_ID"

      - name: verify bearer freshness
        # warn-only（RUNTIME_SMOKE_FRESHNESS_ENFORCE=0）。stale/expired は warning を出すが
        # smoke は実 API チェックへ進む。'1' で hard-fail に戻せる。
        run: pnpm exec tsx scripts/smoke/bearer-freshness-gate.mts

      - name: run runtime smoke
        run: |
          mkdir -p ci-evidence
          bash scripts/smoke/runtime-attendance-provider.sh staging --out-dir ci-evidence --ci-summary

      - name: redaction grep gate
        if: always()
        run: |
          leak_files="$(grep -rEl 'Cookie:|authorization:|Bearer [A-Za-z0-9_-]{20,}|hooks\.slack\.com/services/[A-Z0-9]|sentry\.io/[0-9]+/[0-9]+|xox[bp]-' ci-evidence/ || true)"
          if [ -n "$leak_files" ]; then
            echo "::error::redaction grep gate failed; leaking content is suppressed"
            printf '%s\n' "$leak_files" | sed 's#^#leak-candidate-file=#'
            exit 1
          fi

      - name: upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-staging-${{ github.run_id }}
          path: ci-evidence/
          retention-days: 30

      - name: post failure summary to Slack
        if: ${{ failure() && hashFiles('ci-evidence/summary.json') != '' }}
        env:
          SLACK_WEBHOOK_INCIDENT: ${{ secrets.SLACK_WEBHOOK_INCIDENT }}
        run: |
          if [ -z "${SLACK_WEBHOOK_INCIDENT:-}" ]; then
            echo "::error::SLACK_WEBHOOK_INCIDENT is required for failure notification"
            exit 1
          fi
          bash scripts/smoke/ci-summary-post.sh ci-evidence
